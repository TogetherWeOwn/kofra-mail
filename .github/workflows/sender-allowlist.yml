name: Sender allow-list

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read directory counts or deploy the sending worker
        type: choice
        options:
          - dry-run
          - deploy
        default: dry-run
        required: true

permissions:
  contents: read

jobs:
  sender-allowlist:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ inputs.mode == 'deploy' && 'mail-send-deploy' || format('mail-send-dry-run-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the dispatch to match current main
        if: inputs.mode == 'deploy'
        run: bash tools/sender-allowlist/check-main.sh
      - name: Run sender allow-list job
        run: node tools/sender-allowlist/cli.ts "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
