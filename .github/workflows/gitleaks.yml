name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tgz"
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history using fixed default policy
        run: |
          set -euo pipefail
          # Gitleaks also reads a root ignore file regardless of the flag.
          # Scan Git objects, not the working copy, so removing it hides no history.
          rm -rf -- .gitleaksignore
          policy="$(mktemp -d "$RUNNER_TEMP/gitleaks-policy.XXXXXX")"
          printf '[extend]\nuseDefault = true\n' > "$policy/gitleaks.toml"
          : > "$policy/.gitleaksignore"
          # PR and merge checks cover the checked-out commit's full ancestry.
          # Nightly scans also cover fetched branches and tags.
          refs=HEAD
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then refs='--all HEAD'; fi
          "$RUNNER_TEMP/gitleaks" git . --redact --exit-code 1 \
            --log-opts="--text --diff-merges=first-parent $refs" --ignore-gitleaks-allow \
            --config "$policy/gitleaks.toml" --gitleaks-ignore-path "$policy/.gitleaksignore"
